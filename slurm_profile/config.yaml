# =============================================================================
# slurm_profile/config.yaml
# Snakemake SLURM executor profile for Pawsey Setonix
# =============================================================================
# Usage:
#   snakemake --profile slurm_profile --use-singularity --cores all
# =============================================================================

executor: slurm
jobs: 50
latency-wait: 120
rerun-incomplete: true
keep-going: true
printshellcmds: true
software-deployment-method: apptainer

# Default SLURM resources (overridden per-rule below)
default-resources:
  slurm_account:    "pawsey1018"
  slurm_partition:  "work"
  mem_mb:           16000
  runtime:          "02:00:00"
  cpus_per_task:    8
  nodes:            1
  ntasks:           1

# Per-rule resource overrides
set-resources:
  metaflye:
    mem_mb:          256000
    runtime:         "24:00:00"
    cpus_per_task:   32

  kraken2:
    mem_mb:          64000
    runtime:         "06:00:00"
    cpus_per_task:   16

  hostile:
    mem_mb:          32000
    runtime:         "04:00:00"
    cpus_per_task:   16

  vibrant:
    mem_mb:          32000
    runtime:         "08:00:00"
    cpus_per_task:   16

  genomad:
    mem_mb:          32000
    runtime:         "08:00:00"
    cpus_per_task:   16

  checkv:
    mem_mb:          32000
    runtime:         "04:00:00"
    cpus_per_task:   16

  cdhit:
    mem_mb:          64000
    runtime:         "08:00:00"
    cpus_per_task:   16

  minimap2:
    mem_mb:          32000
    runtime:         "08:00:00"
    cpus_per_task:   16

  coverm:
    mem_mb:          32000
    runtime:         "04:00:00"
    cpus_per_task:   16

  phold:
    mem_mb:          64000
    runtime:         "12:00:00"
    cpus_per_task:   16

  phabox2:
    mem_mb:          64000
    runtime:         "12:00:00"
    cpus_per_task:   16

# SLURM job naming and logging
slurm-jobname-prefix: "virome_"
slurm-logdir: "slurm_logs"
